name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build an unsigned app
        run: |
          xcodebuild \
            -project Podium.xcodeproj \
            -scheme Podium \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign and package the IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Podium.app"
          test -d "$APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          # The unsigned build has no signature, so the entitlements never
          # land in the binary. Ad-hoc sign them in, including the DER form
          # the kernel reads on iOS 15+.
          codesign -s - --force --generate-entitlement-der --entitlements Podium.entitlements Payload/Podium.app
          # macOS 26 prints a [Dict] dump unless --xml is requested, and
          # plutil cannot read that dump. Either form contains the key.
          codesign -d --entitlements - --xml Payload/Podium.app > signed-entitlements.txt 2>codesign-display.txt \
            || codesign -d --entitlements - Payload/Podium.app > signed-entitlements.txt 2>>codesign-display.txt
          cat codesign-display.txt signed-entitlements.txt
          grep -q 'get-task-allow' signed-entitlements.txt
          zip -qry Podium.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Podium-ipa
          path: Podium.ipa
          if-no-files-found: error
